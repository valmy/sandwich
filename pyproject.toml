[project]
name = "sandwich"
version = "0.3.0"
description = "Sandwich is a Python CLI application that fetches and maintains TradingView-compatible trading pair lists from cryptocurrency exchanges. It supports multiple exchanges (Binance, Hyperliquid, Aster), integrates with CoinGecko for volume data, and allows sorting pairs by market metrics. The application uses uv for dependency management and supports different base currencies (USDT, USDC, FDUSD) and market types (spot, swap/perpetual)."
authors = [
    { name = "T. Budiman", email = "tbudiman@gmail.com" }
]
dependencies = [
    "requests>=2.32.3",
    "ccxt>=4.3.98",
    "typer>=0.12.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.scripts]
sandwich = "sandwich:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sandwich"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "types-requests>=2.32.4.20260107",
]
